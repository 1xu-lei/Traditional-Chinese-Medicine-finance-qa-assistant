# ============================================================
# codex 财务问答 Agent 统一配置文件
# 复制为 config.yaml 并填写真实值；也可用环境变量覆盖：
#   DEEPSEEK_API_KEY / DEEPSEEK_MODEL / DB_HOST / DB_PORT / DB_NAME / DB_USER / DB_PASSWORD / PORT
# config.yaml 已在 .gitignore 中，不会入库
# ============================================================

llm:
  api_key: "<YOUR_DEEPSEEK_API_KEY>"
  api_url: "https://api.deepseek.com/v1"
  model: "deepseek-chat"
  temperature: 0.3
  max_tokens: 2048
  timeout: 30
  max_retries: 2

agent:
  max_iterations: 8
  conversation_history_turns: 3
  history_truncate_chars: 500

retriever:
  top_k_faiss: 10
  top_k_bm25: 10
  fusion_top_k: 5
  rrf_k: 60
  intent_weight_boost: 1.3
  sub_label_weight_boost: 1.5

units:
  default_amount_display: "亿元"
  source_unit: "万元"
  display_options: ["亿元", "万元", "元"]

validator:
  max_ratio_value: 10.0
  max_growth_value: 100.0
  max_per_share_value: 100000.0
  min_answer_length: 10
  max_answer_length: 3000
  forbidden_patterns:
    - "我不知道"
    - "我猜"
    - "我觉得"
    - "I don't know"

session:
  ttl_minutes: 30
  max_history_turns: 10
  max_sessions: 500

database:
  host: "localhost"
  port: 3306
  database: "finance_data"
  user: "root"
  password: "<YOUR_DB_PASSWORD>"
